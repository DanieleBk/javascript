<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Escreva o nome do pais que você nasceu:</h1>
    <input type="text" name="pais" id="pais">
    <input type="button" value="Verificar" onclick="consultar()">
    <div id="msg">

    <script>
        function consultar() {
            var nacionalidade = window.document.querySelector('input#pais')
            var msg = window.document.querySelector('div#msg')
            var pais = (nacionalidade.value)           

            msg.innerHTML = `<p>Você nasceu em <strong>${pais}</strong></p>`

            if (pais == 'Brasil') {
                msg.innerHTML += `<p>Você é brasileiro!</p>`
            } else {
                msg.innerHTML += `<p> Você é estrangeiro!</p>`
            }
        }

    </script>
    
</body>
</html>
